@let headerInfo = header();
<div class="feature-header justify-content-between align-items-center">
    <div class="start">
      <div class="title">
        @if (headerInfo){
          <mat-icon class="feature-icon mr-3" [style.color]="headerInfo.color">
            {{ headerInfo.icon }}
          </mat-icon>
        
          <h4>{{headerInfo.title}}</h4>
        }
      </div>

      <ng-content select="p"></ng-content>
    </div>

    <ng-content select=".action"></ng-content>
  </div>
