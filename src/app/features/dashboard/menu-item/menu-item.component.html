@let menuList = menu();
<mat-list>
    @for ( item of menuList; track item.id ){
        <ng-container>
        <!-- If the item doesn't have children show it as list item-->
        @if (item.subMenu === undefined || !item.subMenu){
                <ng-container>
                    @if (item.title){
                        <mat-list-item [routerLink]="item.link" routerLinkActive="active" (click)="updateHeader(item)"
                        [routerLinkActiveOptions]="{ exact: true }"  [class]="{'not_padding': isPadding()}">
                            <mat-icon [style.color]="item.color" mat-list-icon>
                                {{ item.icon }}
                            </mat-icon>
                            <label mat-line class="list-item">{{ item.title }}</label>
                        </mat-list-item>
                    }
                </ng-container>
        }
        @else if (item.subMenu.length > 0) {
            <!-- If the item has subMenu show it as accordion-->
            <ng-container>
                <mat-expansion-panel [expanded]="item.expanded">
                <mat-expansion-panel-header>
                    <mat-panel-title class="d-flex align-items-center">
                        <mat-icon [style.color]="item.color" mat-list-icon>
                            {{ item.icon }}
                        </mat-icon>
                        <span mat-line class="list-item">{{ item.title }}</span>
                    </mat-panel-title>
                </mat-expansion-panel-header>
                <app-menu-item [menu]="item.subMenu" [isPadding]="true" (menuActive)="updateHeader($event)"></app-menu-item>
                </mat-expansion-panel>
            </ng-container>
        }
        </ng-container>
    }
  </mat-list>
